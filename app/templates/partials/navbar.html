<header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800/80 transition-colors">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center space-x-2 text-slate-900 dark:text-white font-bold text-lg hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <span class="tracking-tight">{{ settings.OWNER_NAME }}</span>
            <span class="hidden sm:inline text-[10px] font-normal px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20 ml-1">Instructor</span>
        </a>

        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-800 dark:text-slate-300">
            <a href="/#about"       class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">About</a>
            <a href="/#course"      class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Course</a>
            <a href="/#syllabus"    class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Syllabus</a>
            <a href="/#experience"  class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Experience</a>
            <a href="/#contact"     class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Contact</a>
        </nav>

        <div class="flex items-center space-x-2">
            <!-- Theme Toggle -->
            <button id="theme-toggle" type="button"
                class="p-2 text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white rounded-lg border border-slate-300 dark:border-slate-800 transition"
                title="Toggle Theme">
                <svg id="theme-toggle-sun-icon" class="w-5 h-5 text-amber-500 fill-amber-500" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="theme-toggle-moon-icon" class="hidden w-5 h-5 text-blue-400 fill-blue-400/20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- Enroll CTA (desktop) -->
            <button onclick="openModal('enroll')"
                class="hidden sm:inline-flex items-center space-x-1.5 px-4 py-2 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow-sm transition">
                <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                <span>Enroll Now</span>
            </button>

            <!-- Hamburger (mobile) -->
            <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- Mobile nav -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 px-4 pb-4 pt-2 space-y-1">
        <a href="/#about"      class="block py-2 text-sm text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">About</a>
        <a href="/#course"     class="block py-2 text-sm text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Course</a>
        <a href="/#syllabus"   class="block py-2 text-sm text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Syllabus</a>
        <a href="/#experience" class="block py-2 text-sm text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Experience</a>
        <a href="/#contact"    class="block py-2 text-sm text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Contact</a>
        <div class="pt-2 flex gap-2">
            <button onclick="openModal('enroll')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition">Enroll Now</button>
            <button onclick="openModal('enquiry')" class="flex-1 py-2 text-sm font-medium rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900 transition">Ask a Question</button>
        </div>
    </div>
</header>
