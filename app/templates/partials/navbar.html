<header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800/80 transition-colors">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center space-x-2 text-slate-900 dark:text-white font-bold text-lg hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <span class="tracking-tight">{{ settings.OWNER_NAME }}</span>
        </a>

        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-600 dark:text-slate-300">
            <a href="/#about" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">About</a>
            <a href="/#skills" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Skills</a>
            <a href="/#apps" class="text-blue-600 dark:text-blue-400 font-semibold flex items-center space-x-1.5 transition-colors">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Try My Apps</span>
            </a>
            <a href="/#experience" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Experience</a>
            <a href="/#projects" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Projects</a>
            <a href="/#contact" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Contact</a>
        </nav>

        <div class="flex items-center space-x-3">
            <!-- Theme Toggle Button -->
            <button 
                id="theme-toggle" 
                type="button" 
                class="p-2 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white rounded-lg border border-slate-200 dark:border-slate-800 transition"
                title="Toggle Theme"
            >
                <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden w-4 h-4"></i>
                <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden w-4 h-4 text-amber-400"></i>
            </button>

            <a href="{{ settings.GITHUB_URL }}" target="_blank" rel="noopener noreferrer" class="p-2 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition" title="GitHub">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
            </a>
            
            <a href="#contact" class="hidden sm:inline-flex items-center px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow-sm transition">
                Get In Touch
            </a>
        </div>
    </div>
</header>
