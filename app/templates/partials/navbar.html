<header class="sticky top-0 z-50 backdrop-blur-md bg-white/90 dark:bg-[#070B14]/90 border-b border-slate-200 dark:border-slate-800/80 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        
        <!-- Mythos Brand Logo -->
        <a href="/" class="flex items-center space-x-2.5 text-slate-900 dark:text-white font-extrabold tracking-wider text-xl group">
            <img src="/static/Images/mythos/mythos_icon_transparent.png" 
                 alt="Mythos Icon" 
                 class="w-8 h-8 object-contain group-hover:scale-105 transition-transform duration-200">
            <span class="flex items-center tracking-[0.2em] font-black text-slate-950 dark:text-white">
                MYTH<span class="inline-flex items-center justify-center w-[0.85em] h-[0.85em] mx-[1px]"><svg viewBox="0 0 24 24" class="w-full h-full fill-none" stroke-width="4" stroke-linecap="round"><path d="M12 3 A9 9 0 0 0 12 21" stroke="#2563EB"/><path d="M12 3 A9 9 0 0 1 12 21" stroke="#F97316"/></svg></span>S
            </span>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden lg:flex items-center space-x-6 text-xs uppercase tracking-wider font-semibold text-slate-700 dark:text-slate-300">
            <a href="/#programs"  class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Programs</a>
            <a href="/#career"    class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Career Prep</a>
            <a href="/#syllabus"  class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Curriculum</a>
            <a href="/#projects"  class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Projects</a>
            <a href="/#about"     class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Mentor</a>
        </nav>

        <!-- Right Side CTAs & Theme Toggle -->
        <div class="flex items-center space-x-2.5">
            <!-- Theme Toggle -->
            <button id="theme-toggle" type="button"
                class="p-2 text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white rounded-xl border border-slate-200 dark:border-slate-800 transition hover:bg-slate-100 dark:hover:bg-slate-800"
                title="Toggle Theme">
                <svg id="theme-toggle-sun-icon" class="w-4 h-4 text-amber-500 fill-amber-500" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="theme-toggle-moon-icon" class="hidden w-4 h-4 text-blue-400 fill-blue-400/20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- Download Syllabus CTA (desktop) -->
            <a href="/course/syllabus/download" 
               class="hidden md:inline-flex items-center space-x-1.5 px-3 py-2 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <i data-lucide="download" class="w-3.5 h-3.5 text-blue-500"></i>
                <span>Syllabus</span>
            </a>

            <!-- Apply Now Button (matches Image 4) -->
            <button onclick="openModal('enroll')"
                class="inline-flex items-center space-x-1.5 px-4 py-2 text-xs font-semibold rounded-xl bg-blue-600 hover:bg-blue-500 text-white shadow-md shadow-blue-500/20 transition active:scale-95">
                <span>Apply Now</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </button>

            <!-- Hamburger (mobile) -->
            <button id="mobile-menu-btn" class="lg:hidden p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Nav Menu -->
    <div id="mobile-menu" class="hidden lg:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-[#070B14] px-4 pb-4 pt-3 space-y-1">
        <a href="/#programs"  class="block py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Programs</a>
        <a href="/#career"    class="block py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Career Prep</a>
        <a href="/#syllabus"  class="block py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Curriculum</a>
        <a href="/#projects"  class="block py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Projects</a>
        <a href="/#about"     class="block py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400">Mentor</a>
        <div class="pt-2 flex gap-2">
            <button onclick="openModal('enroll')" class="flex-1 py-2 text-xs font-semibold rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition">Apply Now</button>
            <a href="/course/syllabus/download" class="flex-1 text-center py-2 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900 transition">Syllabus PDF</a>
        </div>
    </div>
</header>
